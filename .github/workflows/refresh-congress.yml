name: Refresh House disclosures

# Pulls the latest STOCK Act periodic transaction reports from the Clerk of the
# House each morning and commits the parsed result. Committing is what triggers
# the Vercel redeploy, so the site is never serving data older than a day.

on:
  schedule:
    # 11:00 UTC — early morning US, after overnight filings post
    - cron: "0 11 * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-congress
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Scrape House disclosures
        run: node scripts/scrape-congress.mjs --limit 40

      - name: Verify the scrape produced usable data
        run: |
          node -e "
            const d = require('./src/lib/congress-live.json');
            const n = d.trades?.length ?? 0;
            if (n < 20) {
              console.error('Refusing to commit: only ' + n + ' trades parsed.');
              process.exit(1);
            }
            console.log('Parsed ' + n + ' trades.');
          "

      - name: Commit if the data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/lib/congress-live.json; then
            echo "No new filings today."
            exit 0
          fi
          COUNT=$(node -p "require('./src/lib/congress-live.json').trades.length")
          git add src/lib/congress-live.json
          git commit -m "Refresh House disclosures ($COUNT trades)"
          git push
