name: Supervised House disclosure refresh

# Manual only. There is deliberately no `schedule:` trigger.
#
# The previous automated importer ran daily and published incorrect data for
# eight consecutive days while reporting success. The schedule stays off until
# one complete supervised run has been reviewed end to end.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What this run should do"
        type: choice
        default: dry-run
        options:
          - dry-run          # parse and validate, write nothing
          - import           # full import, commit only if every gate passes
          - simulate-failure # deliberately trip a gate, to prove evidence upload
      allow_completeness_drop:
        description: "Accept a lower yield than the previous run (reviewed override)"
        type: boolean
        default: false
      simulate_gate_failure:
        description: "SIMULATION ONLY — inject a gate failure to prove evidence upload. Never valid with mode=import."
        type: boolean
        default: false

# One import at a time. Two concurrent runs could interleave commits to the
# archive, which is the one file that must never be written by two writers.
concurrency:
  group: house-disclosure-import
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Requirement: `import` must never carry the simulation flag. Checked
      # before anything runs, so a mistaken dispatch stops immediately.
      - name: Refuse import mode combined with simulation
        run: |
          if [ "${{ inputs.mode }}" = "import" ] && [ "${{ inputs.simulate_gate_failure }}" = "true" ]; then
            echo "::error::simulate_gate_failure cannot be used with mode=import."
            echo "Simulation deliberately fails a gate; combining it with a real import is never valid."
            exit 1
          fi
          echo "Mode=${{ inputs.mode }}, simulation=${{ inputs.simulate_gate_failure }} — combination allowed."

      - name: Verify the pipeline's own tests before touching data
        run: npm test

      # The pointer is committed, so a copy from a previous run is present after
      # checkout. If the importer crashed before writing a new one, a stale
      # pointer would make the upload step attach a previous run's evidence to
      # this execution. Removing it first means anything found later was
      # necessarily written by this run.
      # The pointer is gitignored so checkout cannot supply one, and it is
      # removed here as well in case a cached workspace carries one over. After
      # this step, any pointer present was necessarily written by this run.
      - name: Invalidate any pointer inherited from checkout
        run: |
          rm -f data/import-runs/latest-run-id.txt
          if [ -f data/import-runs/latest-run-id.txt ]; then
            echo "::error::Failed to clear the inherited run pointer."
            exit 1
          fi
          echo "Inherited run pointer cleared; evidence must be produced by this run."

      # ---------------------------------------------------------------------
      # The import. `continue-on-error` is essential: a non-zero exit must not
      # skip the upload steps below, because a failed run is precisely the one
      # whose evidence needs preserving.
      # ---------------------------------------------------------------------
      - name: Run the importer
        id: import
        continue-on-error: true
        run: |
          set +e
          case "${{ inputs.mode }}" in
            dry-run)
              ARGS="--dry-run"
              ;;
            simulate-failure)
              # Deterministic: injects a named gate failure after assessment,
              # whatever the source currently holds. A narrow window was not
              # deterministic — whether it failed depended on the yield of that
              # day's newest filings.
              ARGS="--simulate-gate-failure"
              ;;
            *)
              ARGS=""
              ;;
          esac

          if [ "${{ inputs.allow_completeness_drop }}" = "true" ]; then
            ARGS="$ARGS --allow-completeness-drop"
          fi
          if [ "${{ inputs.simulate_gate_failure }}" = "true" ]; then
            ARGS="$ARGS --simulate-gate-failure"
          fi

          echo "Running: node scripts/import-house.ts $ARGS"
          node --experimental-strip-types scripts/import-house.ts $ARGS 2>&1 | tee import.log
          IMPORT_EXIT=${PIPESTATUS[0]}
          echo "import_exit=$IMPORT_EXIT" >> "$GITHUB_OUTPUT"
          exit $IMPORT_EXIT

      # Evidence is resolved only from this execution. The inherited pointer was
      # deleted above, so a pointer present now was necessarily written by this
      # run. If the importer crashed before producing evidence, that is reported
      # honestly as has_evidence=false rather than reaching for an older run.
      - name: Resolve run identity
        id: run
        if: always()
        run: |
          RUN_ID="${{ steps.import.outputs.run_id }}"
          SOURCE="importer output"

          if [ -z "$RUN_ID" ] && [ -f data/import-runs/latest-run-id.txt ]; then
            RUN_ID=$(cat data/import-runs/latest-run-id.txt)
            SOURCE="pointer written by this run"
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::warning::The importer produced no run id — it failed before creating evidence."
            echo "has_evidence=false" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Run id $RUN_ID (from $SOURCE)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          if [ -d "data/import-runs/$RUN_ID" ]; then
            echo "run_dir=data/import-runs/$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "has_evidence=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Run id $RUN_ID has no evidence directory."
            echo "has_evidence=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # Evidence upload. Runs whatever happened above.
      # ---------------------------------------------------------------------
      - name: Upload this run's evidence directory
        if: always() && steps.run.outputs.has_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: import-run-${{ steps.run.outputs.run_id }}
          path: ${{ steps.run.outputs.run_dir }}/
          retention-days: 90
          if-no-files-found: error

      # Uploaded regardless. When the importer crashed before producing
      # evidence, this log is the only record of what happened.
      - name: Upload report, quarantine queue and run index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-report-${{ github.run_id }}
          path: |
            data/last-import-report.txt
            data/congress-quarantine.json
            data/import-runs/index.json
            import.log
          retention-days: 90
          if-no-files-found: warn

      # ---------------------------------------------------------------------
      # Validation summary, rendered on the run's page.
      # ---------------------------------------------------------------------
      - name: Publish validation summary
        if: always()
        run: |
          RUN_DIR="${{ steps.run.outputs.run_dir }}"

          # Simulation is reported as *effective*, not as the raw checkbox.
          # `mode=simulate-failure` supplies --simulate-gate-failure on its own,
          # so the checkbox reads false on a run that is unambiguously a
          # simulation. Reporting the input alone said "Simulation: false" on
          # the very run whose purpose was to simulate a failure.
          EFFECTIVE_SIMULATION=false
          if [ "${{ inputs.mode }}" = "simulate-failure" ] || [ "${{ inputs.simulate_gate_failure }}" = "true" ]; then
            EFFECTIVE_SIMULATION=true
          fi

          {
            echo "## House disclosure import"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | \`${{ inputs.mode }}\` |"
            echo "| Completeness override | \`${{ inputs.allow_completeness_drop }}\` |"
            echo "| Importer exit code | \`${{ steps.import.outputs.import_exit }}\` |"
            echo "| Effective simulation | \`$EFFECTIVE_SIMULATION\` |"
            echo "| Simulation checkbox | \`${{ inputs.simulate_gate_failure }}\` |"
            echo "| Run id | \`${{ steps.run.outputs.run_id }}\` |"
            echo "| Evidence produced | \`${{ steps.run.outputs.has_evidence }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/summary.json" ]; then
            node -e '
              const s = require("./" + process.argv[1] + "/summary.json");
              const c = s.counts;
              const rows = [
                ["Gates", s.passed ? "PASS" : "**FAIL**"],
                ["Production updated", s.productionUpdated ? "yes" : "no — previous archive retained"],
                ["Filings selected", c.selectedFilings],
                ["Filings downloaded", c.downloadedFilings],
                ["Filings parsed", c.parsedFilings],
                ["Rows parsed", c.parsedRecords],
                ["Accepted", c.accepted],
                ["Quarantined", c.quarantined],
                ["Archive before", c.archiveBefore],
                ["Archive after", c.archiveAfter],
              ];
              let out = "### Validation\n\n| | |\n|---|---|\n";
              for (const [k, v] of rows) out += `| ${k} | ${v} |\n`;
              if (s.failures.length) {
                out += "\n### Gate failures\n\n";
                for (const f of s.failures) out += `- \`${f}\`\n`;
              }
              if (s.warnings.length) {
                out += "\n### Warnings\n\n";
                for (const w of s.warnings) out += `- \`${w}\`\n`;
              }

              // Zero-row filings, by reason. Written on every run, so an empty
              // filing is never reported merely as a number.
              const fs = require("fs");
              const zeroPath = process.argv[1] + "/zero-row-filings.json";
              if (fs.existsSync(zeroPath)) {
                const z = JSON.parse(fs.readFileSync(zeroPath, "utf8"));
                out += "\n### Filings with no rows\n\n| Reason | Count |\n|---|---|\n";
                for (const [k, v] of Object.entries(z.counts)) out += `| \`${k}\` | ${v} |\n`;
                const regressions = z.filings.filter((f) => f.previouslyProductive);
                if (regressions.length) {
                  out += "\n**Previously productive filings that are now empty:**\n\n";
                  for (const f of regressions.slice(0, 10)) {
                    out += `- [\`${f.docId}\`](${f.filingUrl}) ${f.filer} — \`${f.classification}\`\n`;
                  }
                }
              }
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
            ' "$RUN_DIR"

            {
              echo ""
              echo "<details><summary>Full import report</summary>"
              echo ""
              echo '```'
              cat "$RUN_DIR/report.txt"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### No evidence produced"
              echo ""
              echo "The importer failed before writing an evidence directory."
              echo "Only \`import.log\` was uploaded. **Evidence from earlier runs was deliberately not substituted.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ---------------------------------------------------------------------
      # Commit. Only on a clean pass, and only in `import` mode.
      #
      # `steps.import.outcome == 'success'` is the gate: the importer exits
      # non-zero whenever a run gate fails, so a failing run can never reach
      # this step.
      # ---------------------------------------------------------------------
      - name: Commit approved data
        if: >-
          inputs.mode == 'import' &&
          inputs.simulate_gate_failure != true &&
          steps.import.outcome == 'success' &&
          steps.run.outputs.has_evidence == 'true'
        run: |
          set -euo pipefail
          RUN_DIR="${{ steps.run.outputs.run_dir }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Explicit paths only. Nothing else in the tree is committed.
          git add \
            src/lib/congress-live.json \
            data/congress-quarantine.json \
            data/last-import-report.txt \
            data/import-runs/index.json \
            "$RUN_DIR"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          COUNT=$(node -p "require('./src/lib/congress-live.json').trades.length")
          git commit -m "Refresh House disclosures (${COUNT} records, run ${{ steps.run.outputs.run_id }})"
          git push

      - name: Report that no commit was made
        if: inputs.mode != 'import' || steps.import.outcome != 'success'
        run: |
          echo "No commit: mode=${{ inputs.mode }}, importer outcome=${{ steps.import.outcome }}."
          echo "Production data is untouched. Evidence was uploaded above."
          {
            echo ""
            echo "> **No commit was made.** Production data is untouched; evidence is attached to this run."
          } >> "$GITHUB_STEP_SUMMARY"

      # The job's own result must reflect the importer's, which
      # `continue-on-error` deliberately suppressed until the uploads finished.
      - name: Fail the job if the importer failed
        if: steps.import.outcome != 'success'
        run: |
          echo "Importer exited ${{ steps.import.outputs.import_exit }}."
          exit 1
