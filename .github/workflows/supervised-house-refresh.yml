name: Supervised House disclosure refresh

# No scheduled imports until OUTFOX_HOUSE_REFRESH_MODE is explicitly set.
# After independent review, start with dry-run. Scheduled import additionally
# requires OUTFOX_HOUSE_LIVE_VERIFIED=true after a supervised live verification.
on:
  schedule:
    - cron: '17 23 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: "What this run should do"
        type: choice
        default: dry-run
        options:
          - dry-run          # parse and validate, write nothing
          - import           # full import, commit only if every gate passes
          - simulate-failure # deliberately trip a gate, to prove evidence upload
      allow_completeness_drop:
        description: "Accept a lower yield than the previous run (reviewed override)"
        type: boolean
        default: false
      simulate_gate_failure:
        description: "SIMULATION ONLY — inject a gate failure to prove evidence upload. Never valid with mode=import."
        type: boolean
        default: false

# One import at a time. Two concurrent runs could interleave commits to the
# archive, which is the one file that must never be written by two writers.
concurrency:
  group: house-disclosure-import
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' &&
        (vars.OUTFOX_HOUSE_REFRESH_MODE == 'dry-run' ||
         vars.OUTFOX_HOUSE_REFRESH_MODE == 'import'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      candidate: ${{ steps.candidate.outputs.changed }}
      run_id: ${{ steps.run.outputs.run_id }}
    env:
      HOUSE_MODE: ${{ github.event_name == 'schedule' && vars.OUTFOX_HOUSE_REFRESH_MODE || inputs.mode }}
      HOUSE_ALLOW_DROP: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_completeness_drop }}
      HOUSE_SIMULATE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_gate_failure }}
      HOUSE_LIVE_VERIFIED: ${{ vars.OUTFOX_HOUSE_LIVE_VERIFIED }}

    steps:
      - name: Validate refresh mode and publish target
        run: |
          case "$HOUSE_MODE" in
            dry-run|import|simulate-failure) ;;
            *) echo "::error::Unrecognized refresh mode."; exit 1 ;;
          esac
          if [ "$HOUSE_MODE" = "import" ] && [ "$HOUSE_SIMULATE" = "true" ]; then
            echo "::error::The importer cannot publish from a simulation."
            exit 1
          fi
          # The deployed branch is main. Do not depend on a repository field
          # in the event payload, which may be absent on a scheduled run.
          if [ "$HOUSE_MODE" = "import" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::The importer can publish only from main."
            exit 1
          fi
          if [ "$HOUSE_MODE" = "import" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$HOUSE_LIVE_VERIFIED" != "true" ]; then
            echo "::error::Verify a supervised live refresh before enabling scheduled publishing."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # A previous push may have landed without reaching the site. Do not
      # keep committing newer releases on top of an unverified deployment.
      - name: Verify the previous scheduled release is live
        if: github.event_name == 'schedule' && env.HOUSE_MODE == 'import'
        run: node --experimental-strip-types scripts/house-refresh-release.ts verify-live 1

      - run: npm ci

      - name: Verify the pipeline's own tests before touching data
        run: npm test

      # The pointer is committed, so a copy from a previous run is present after
      # checkout. If the importer crashed before writing a new one, a stale
      # pointer would make the upload step attach a previous run's evidence to
      # this execution. Removing it first means anything found later was
      # necessarily written by this run.
      # The pointer is gitignored so checkout cannot supply one, and it is
      # removed here as well in case a cached workspace carries one over. After
      # this step, any pointer present was necessarily written by this run.
      - name: Invalidate any pointer inherited from checkout
        run: |
          rm -f data/import-runs/latest-run-id.txt
          if [ -f data/import-runs/latest-run-id.txt ]; then
            echo "::error::Failed to clear the inherited run pointer."
            exit 1
          fi
          echo "Inherited run pointer cleared; evidence must be produced by this run."

      # ---------------------------------------------------------------------
      # The import. `continue-on-error` is essential: a non-zero exit must not
      # skip the upload steps below, because a failed run is precisely the one
      # whose evidence needs preserving.
      # ---------------------------------------------------------------------
      - name: Run the importer
        id: import
        continue-on-error: true
        run: |
          set +e
          case "$HOUSE_MODE" in
            dry-run)
              ARGS="--dry-run"
              ;;
            simulate-failure)
              # Deterministic: injects a named gate failure after assessment,
              # whatever the source currently holds. A narrow window was not
              # deterministic — whether it failed depended on the yield of that
              # day's newest filings.
              ARGS="--simulate-gate-failure"
              ;;
            import)
              ARGS=""
              ;;
            *) exit 1 ;;
          esac

          if [ "$HOUSE_ALLOW_DROP" = "true" ]; then
            ARGS="$ARGS --allow-completeness-drop"
          fi
          if [ "$HOUSE_SIMULATE" = "true" ]; then
            ARGS="$ARGS --simulate-gate-failure"
          fi

          echo "Running: node scripts/import-house.ts $ARGS"
          node --experimental-strip-types scripts/import-house.ts $ARGS 2>&1 | tee import.log
          IMPORT_EXIT=${PIPESTATUS[0]}
          echo "import_exit=$IMPORT_EXIT" >> "$GITHUB_OUTPUT"
          exit $IMPORT_EXIT

      # Evidence is resolved only from this execution. The inherited pointer was
      # deleted above, so a pointer present now was necessarily written by this
      # run. If the importer crashed before producing evidence, that is reported
      # honestly as has_evidence=false rather than reaching for an older run.
      - name: Resolve run identity
        id: run
        if: always()
        env:
          IMPORTER_RUN_ID: ${{ steps.import.outputs.run_id }}
        run: |
          RUN_ID="$IMPORTER_RUN_ID"
          SOURCE="importer output"

          if [ -z "$RUN_ID" ] && [ -f data/import-runs/latest-run-id.txt ]; then
            RUN_ID=$(cat data/import-runs/latest-run-id.txt)
            SOURCE="pointer written by this run"
          fi

          if [ -z "$RUN_ID" ]; then
            echo "::warning::The importer produced no run id — it failed before creating evidence."
            echo "has_evidence=false" >> "$GITHUB_OUTPUT"
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$RUN_ID" =~ ^run_[0-9]{4}(-[0-9]{2}){2}T[0-9]{2}(-[0-9]{2}){2}-[0-9]{3}Z_[0-9a-f]{8}$ ]]; then
            echo "::error::Invalid run ID."
            exit 1
          fi

          echo "Run id $RUN_ID (from $SOURCE)"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          if [ -d "data/import-runs/$RUN_ID" ]; then
            echo "run_dir=data/import-runs/$RUN_ID" >> "$GITHUB_OUTPUT"
            echo "has_evidence=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Run id $RUN_ID has no evidence directory."
            echo "has_evidence=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------------
      # Evidence upload. Runs whatever happened above.
      # ---------------------------------------------------------------------
      - name: Upload this run's evidence directory
        if: always() && steps.run.outputs.has_evidence == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: import-run-${{ steps.run.outputs.run_id }}
          path: ${{ steps.run.outputs.run_dir }}/
          retention-days: 90
          if-no-files-found: error

      # Uploaded regardless. When the importer crashed before producing
      # evidence, this log is the only record of what happened.
      - name: Upload report, quarantine queue and run index
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-report-${{ github.run_id }}
          path: |
            data/last-import-report.txt
            data/congress-quarantine.json
            data/import-runs/index.json
            import.log
          retention-days: 90
          if-no-files-found: warn

      # ---------------------------------------------------------------------
      # Validation summary, rendered on the run's page.
      # ---------------------------------------------------------------------
      - name: Publish validation summary
        if: always()
        run: |
          RUN_DIR="${{ steps.run.outputs.run_dir }}"

          # Simulation is reported as *effective*, not as the raw checkbox.
          # `mode=simulate-failure` supplies --simulate-gate-failure on its own,
          # so the checkbox reads false on a run that is unambiguously a
          # simulation. Reporting the input alone said "Simulation: false" on
          # the very run whose purpose was to simulate a failure.
          EFFECTIVE_SIMULATION=false
          if [ "$HOUSE_MODE" = "simulate-failure" ] || [ "$HOUSE_SIMULATE" = "true" ]; then
            EFFECTIVE_SIMULATION=true
          fi

          {
            echo "## House disclosure import"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | \`$HOUSE_MODE\` |"
            echo "| Completeness override | \`$HOUSE_ALLOW_DROP\` |"
            echo "| Importer exit code | \`${{ steps.import.outputs.import_exit }}\` |"
            echo "| Effective simulation | \`$EFFECTIVE_SIMULATION\` |"
            echo "| Simulation checkbox | \`$HOUSE_SIMULATE\` |"
            echo "| Run id | \`${{ steps.run.outputs.run_id }}\` |"
            echo "| Evidence produced | \`${{ steps.run.outputs.has_evidence }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/summary.json" ]; then
            node -e '
              const s = require("./" + process.argv[1] + "/summary.json");
              const c = s.counts;
              const rows = [
                ["Gates", s.passed ? "PASS" : "**FAIL**"],
                ["Runner candidate updated", s.productionUpdated ? "yes" : "no — previous archive retained"],
                ["Filings selected", c.selectedFilings],
                ["Filings downloaded", c.downloadedFilings],
                ["Filings parsed", c.parsedFilings],
                ["Rows parsed", c.parsedRecords],
                ["Accepted", c.accepted],
                ["Quarantined", c.quarantined],
                ["Archive before", c.archiveBefore],
                ["Archive after", c.archiveAfter],
              ];
              let out = "### Validation\n\n| | |\n|---|---|\n";
              for (const [k, v] of rows) out += `| ${k} | ${v} |\n`;
              if (s.failures.length) {
                out += "\n### Gate failures\n\n";
                for (const f of s.failures) out += `- \`${f}\`\n`;
              }
              if (s.warnings.length) {
                out += "\n### Warnings\n\n";
                for (const w of s.warnings) out += `- \`${w}\`\n`;
              }

              // Zero-row filings, by reason. Written on every run, so an empty
              // filing is never reported merely as a number.
              const fs = require("fs");
              const zeroPath = process.argv[1] + "/zero-row-filings.json";
              if (fs.existsSync(zeroPath)) {
                const z = JSON.parse(fs.readFileSync(zeroPath, "utf8"));
                out += "\n### Filings with no rows\n\n| Reason | Count |\n|---|---|\n";
                for (const [k, v] of Object.entries(z.counts)) out += `| \`${k}\` | ${v} |\n`;
                const regressions = z.filings.filter((f) => f.previouslyProductive);
                if (regressions.length) {
                  out += "\n**Previously productive filings that are now empty:**\n\n";
                  for (const f of regressions.slice(0, 10)) {
                    out += `- [\`${f.docId}\`](${f.filingUrl}) ${f.filer} — \`${f.classification}\`\n`;
                  }
                }
              }
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
            ' "$RUN_DIR"

            {
              echo ""
              echo "<details><summary>Full import report</summary>"
              echo ""
              echo '```'
              cat "$RUN_DIR/report.txt"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### No evidence produced"
              echo ""
              echo "The importer failed before writing an evidence directory."
              echo "Only \`import.log\` was uploaded. **Evidence from earlier runs was deliberately not substituted.**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage a changed, verified candidate
        id: candidate
        if: >-
          env.HOUSE_MODE == 'import' &&
          env.HOUSE_SIMULATE != 'true' &&
          github.ref == 'refs/heads/main' &&
          steps.import.outcome == 'success' &&
          steps.run.outputs.has_evidence == 'true'
        env:
          RUN_DIR: ${{ steps.run.outputs.run_dir }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: |
          set -euo pipefail
          change=$(node --experimental-strip-types scripts/house-refresh-release.ts check "$RUN_ID")
          if [ "$change" = "unchanged" ]; then
            echo "No new or revised House records. Retaining the last published archive."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$change" = "changed"

          # Validate the resulting data, not just the checked-out snapshot.
          npm test
          git add \
            src/lib/congress-live.json \
            data/congress-quarantine.json \
            data/last-import-report.txt \
            data/import-runs/index.json \
            "$RUN_DIR"

          git diff --cached --binary > "$RUNNER_TEMP/house-data.patch"
          test -s "$RUNNER_TEMP/house-data.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Hand off data only
        if: steps.candidate.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: house-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/house-data.patch
          retention-days: 7
          if-no-files-found: error

      - name: Report no publication candidate
        if: always() && steps.candidate.outputs.changed != 'true'
        run: |
          {
            echo ""
            echo "> **No publication candidate.** Existing production data was not replaced."
          } >> "$GITHUB_STEP_SUMMARY"

      # The job's own result must reflect the importer's, which
      # `continue-on-error` deliberately suppressed until the uploads finished.
      - name: Fail the job if the importer failed or left no evidence
        if: always() && (steps.import.outcome != 'success' || steps.run.outputs.has_evidence != 'true')
        run: |
          echo "The importer did not complete with valid run evidence."
          exit 1

  publish:
    needs: refresh
    if: github.ref == 'refs/heads/main' && needs.refresh.outputs.candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUN_ID: ${{ needs.refresh.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          name: house-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/house-candidate

      # No package installation, PDF processing or candidate code runs with the
      # write token. A stale checkout cannot overwrite a newer push to main.
      - name: Validate the handoff on a clean checkout
        run: node --experimental-strip-types scripts/house-refresh-release.ts apply "$RUN_ID" "$RUNNER_TEMP/house-candidate/house-data.patch"

      - name: Push the verified archive
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(node -p "require('./src/lib/congress-live.json').trades.length")
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Refresh House disclosures ($count records, $RUN_ID)"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c core.hooksPath=/dev/null -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin HEAD:refs/heads/main
          echo "Pushed the archive; live deployment is not verified yet." >> "$GITHUB_STEP_SUMMARY"

      - name: Require the matching public archive
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/house-refresh-release.ts verify-live 20
          echo "Verified the archive timestamp and record count on the live site." >> "$GITHUB_STEP_SUMMARY"
